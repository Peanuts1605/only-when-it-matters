[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "only-when-it-matters"
version = "0.1.0"
description = "A Strands agent that protects human attention during contest delivery."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "strands-agents==1.54.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
only-when-it-matters = "only_when_it_matters.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/only_when_it_matters"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

